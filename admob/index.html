<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>NexaLearn AI Ads</title>

<style>

body{
  margin:0;
  padding:20px;
  font-family:Arial, sans-serif;
  background:#050816;
  color:white;
  text-align:center;
}

.title{
  margin-top:40px;
  font-size:34px;
  font-weight:bold;
  background:linear-gradient(90deg,#00e5ff,#7f00ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.card{
  margin-top:30px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:24px;
  padding:25px;
  backdrop-filter:blur(20px);
}

button{
  width:100%;
  margin-top:18px;
  padding:18px;
  border:none;
  border-radius:18px;
  font-size:17px;
  font-weight:bold;
  color:white;
  cursor:pointer;
  background:linear-gradient(90deg,#00c6ff,#7f00ff);
}

.status{
  margin-top:20px;
  opacity:0.8;
  font-size:15px;
}

</style>
</head>

<body>

<div class="title">
NexaLearn AI
</div>

<div class="card">

<h2>⚡ Reward System</h2>

<p>Watch ads and earn Nexa Coins</p>

<button onclick="showRewardAd()">
🎁 Watch Reward Ad
</button>

<button onclick="showInterstitialAd()">
🚀 Open Next Session
</button>

<div class="status" id="status">
Initializing Ads...
</div>

</div>

<!-- Capacitor -->
<script type="module">

import {
  AdMob,
  RewardAdPluginEvents,
  InterstitialAdPluginEvents
} from '@capacitor-community/admob';

/* ========================= */
/* YOUR REAL ADMOB IDS */
/* ========================= */

const REWARD_ID =
'ca-app-pub-2996487725106736/3879142624';

const INTERSTITIAL_ID =
'ca-app-pub-2996487725106736/8251906012';

/* ========================= */
/* INITIALIZE ADMOB */
/* ========================= */

async function startAdMob(){

  try{

    await AdMob.initialize({
      requestTrackingAuthorization: false,
      initializeForTesting: false
    });

    document.getElementById("status").innerHTML =
    "✅ AdMob Initialized";

    loadRewardAd();
    loadInterstitialAd();

  }catch(err){

    console.log(err);

    document.getElementById("status").innerHTML =
    "❌ AdMob Failed";

  }

}

/* ========================= */
/* LOAD REWARD AD */
/* ========================= */

async function loadRewardAd(){

  await AdMob.prepareRewardVideoAd({
    adId: REWARD_ID,
    isTesting: false
  });

  document.getElementById("status").innerHTML =
  "🎁 Reward Ad Ready";

}

/* ========================= */
/* LOAD INTERSTITIAL */
/* ========================= */

async function loadInterstitialAd(){

  await AdMob.prepareInterstitial({
    adId: INTERSTITIAL_ID,
    isTesting: false
  });

}

/* ========================= */
/* SHOW REWARD AD */
/* ========================= */

window.showRewardAd = async function(){

  try{

    await AdMob.showRewardVideoAd();

  }catch(err){

    alert("Reward ad not ready");

  }

}

/* ========================= */
/* SHOW INTERSTITIAL */
/* ========================= */

window.showInterstitialAd = async function(){

  try{

    await AdMob.showInterstitial();

  }catch(err){

    alert("Interstitial ad not ready");

  }

}

/* ========================= */
/* EVENTS */
/* ========================= */

AdMob.addListener(
  RewardAdPluginEvents.Rewarded,
  () => {

    alert("🎉 You earned Nexa Coins!");

    loadRewardAd();

  }
);

AdMob.addListener(
  InterstitialAdPluginEvents.Dismissed,
  () => {

    loadInterstitialAd();

  }
);

/* ========================= */
/* START */
/* ========================= */

startAdMob();

</script>

</body>
</html>
