<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexaLearn Ads System</title>

<style>

body{
background:#050816;
font-family:Arial;
color:white;
margin:0;
padding:20px;
text-align:center;
}

.title{
font-size:32px;
font-weight:bold;
margin-top:40px;
background:linear-gradient(90deg,#00f0ff,#8a2eff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
padding:25px;
margin-top:30px;
border-radius:25px;
backdrop-filter:blur(20px);
}

button{
width:100%;
padding:18px;
border:none;
border-radius:20px;
font-size:18px;
font-weight:bold;
margin-top:20px;
cursor:pointer;
color:white;
background:linear-gradient(90deg,#00c6ff,#7f00ff);
box-shadow:0 0 25px rgba(0,255,255,0.3);
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

.nativeAd{
margin-top:25px;
padding:20px;
border-radius:20px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
}

.loading{
margin-top:20px;
font-size:15px;
opacity:0.7;
}

</style>
</head>

<body>

<div class="title">
NexaLearn AI
</div>

<div class="card">

<h2>⚡ Neural Reward System</h2>

<p>
Watch ads and earn 10 Nexa Coins
</p>

<button onclick="showRewardAd()">
🧠 Watch & Earn
</button>

<button onclick="showInterstitialAd()">
🚀 Continue Session
</button>

<div class="loading" id="status">
Loading Ads...
</div>

</div>

<!-- Native Ad -->
<div class="nativeAd">

<h3>
📚 Sponsored Learning
</h3>

<div id="native-ad-container">
Loading sponsored content...
</div>

</div>

<script>

let rewardLoaded = false;
let interstitialLoaded = false;

/* ========================= */
/* START ADMOB */
/* ========================= */

document.addEventListener("deviceready", startAds, false);

function startAds(){

if(!window.admob){
document.getElementById("status").innerHTML =
"AdMob SDK Not Found";
return;
}

admob.start();

/* ========================= */
/* REWARDED INTERSTITIAL */
/* ========================= */

admob.rewardvideo.config({

id: "ca-app-pub-2996487725106736/3879142624",

isTesting: false,

autoShow: false

});

admob.rewardvideo.prepare();

/* ========================= */
/* INTERSTITIAL */
/* ========================= */

admob.interstitial.config({

id: "ca-app-pub-2996487725106736/8251906012",

isTesting: false,

autoShow: false

});

admob.interstitial.prepare();

/* ========================= */
/* NATIVE ADS */
/* ========================= */

admob.nativead.config({

id: "ca-app-pub-2996487725106736/2904587862",

isTesting: false,

autoShow: true

});

admob.nativead.prepare();

/* ========================= */
/* EVENTS */
/* ========================= */

document.addEventListener(
"admob.rewardvideo.load",
function(){

rewardLoaded = true;

document.getElementById("status").innerHTML =
"✅ Reward Ad Ready";

}
);

document.addEventListener(
"admob.rewardvideo.close",
function(){

rewardLoaded = false;

admob.rewardvideo.prepare();

}
);

document.addEventListener(
"admob.rewardvideo.reward",
function(){

alert("🎉 You earned 10 Nexa!");

}
);

document.addEventListener(
"admob.interstitial.load",
function(){

interstitialLoaded = true;

}
);

document.addEventListener(
"admob.interstitial.close",
function(){

interstitialLoaded = false;

admob.interstitial.prepare();

}
);

}

let lastInterstitial = 0;

/* ========================= */
/* SHOW REWARD */
/* ========================= */

function showRewardAd(){

if(rewardLoaded){

admob.rewardvideo.show();

}else{

alert("⚠️ Neural Reward ad is still caching. Please try again in a few seconds!");

}

}

/* ========================= */
/* SHOW INTERSTITIAL */
/* ========================= */

function showInterstitialAd(){

const now = Date.now();
if(now - lastInterstitial < 600000){ // 10 minutes limit
const secondsLeft = Math.round((600000 - (now - lastInterstitial)) / 1000);
const minutesLeft = Math.ceil(secondsLeft / 60);
alert("⏳ Cooldown Alert: Please wait " + minutesLeft + " min to continue another session to prevent invalid AdMob traffic.");
return;
}

if(interstitialLoaded){

lastInterstitial = now;
admob.interstitial.show();

}else{

alert("⚠️ Ads are currently premium or loading. Continuing session offline smoothly.");

}

}

</script>

</body>
</html>
